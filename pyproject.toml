[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-ping"
version = "2.2.0"
description = "Multi-mode network diagnostic skill compatible with any AI coding assistant (opencode, Claude Code, WorkBuddy, etc.)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "citie114514"}
]
dependencies = [
    "requests>=2.28.0",
    "dnspython>=2.4.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access (deselect with '-m \"not integration\"')",
]
